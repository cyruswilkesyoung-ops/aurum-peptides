<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760"
     fill="none" role="presentation" aria-hidden="true">
  <defs>
    <!-- glass body: bright at both edges, hollow through the middle -->
    <linearGradient id="hvGlass" x1="252" y1="0" x2="468" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".08"  stop-color="#fff" stop-opacity=".11"/>
      <stop offset=".33"  stop-color="#fff" stop-opacity=".04"/>
      <stop offset=".62"  stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".88"  stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1"    stop-color="#fff" stop-opacity=".36"/>
    </linearGradient>
    <!-- the same metallic ramp the packshots use, so it reads as one brand -->
    <linearGradient id="hvCap" x1="248" y1="0" x2="472" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#5C4A1E"/>
      <stop offset=".16" stop-color="#E7CD8A"/>
      <stop offset=".5"  stop-color="#C9A84C"/>
      <stop offset=".82" stop-color="#E7CD8A"/>
      <stop offset="1"   stop-color="#5C4A1E"/>
    </linearGradient>
    <linearGradient id="hvPowder" x1="0" y1="470" x2="0" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F4EFE2"/>
      <stop offset="1"   stop-color="#CFC6AE"/>
    </linearGradient>
    <linearGradient id="hvLabel" x1="0" y1="392" x2="0" y2="536" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F7F3E8"/>
      <stop offset="1"   stop-color="#DCD4C2"/>
    </linearGradient>
    <radialGradient id="hvGlow" cx="360" cy="430" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#C9A84C" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#C9A84C" stop-opacity=".07"/>
      <stop offset="1"   stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hvShadow" cx="360" cy="678" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#000" stop-opacity=".72"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hvBody"><rect x="252" y="238" width="216" height="380" rx="26"/></clipPath>
  </defs>

  <!-- ambient pool of gold behind everything -->
  <rect width="720" height="760" fill="url(#hvGlow)"/>

  <!-- the certificate behind the vial. the brand's whole claim is "documented",
       so the paper is part of the product, not decoration. -->
  <g transform="rotate(-7 360 420)" opacity=".5">
    <rect x="176" y="196" width="368" height="452" rx="4"
          fill="#0e0e0c" stroke="#C9A84C" stroke-opacity=".26"/>
    <rect x="176" y="196" width="368" height="46" fill="#C9A84C" fill-opacity=".07"/>
    <g stroke="#C9A84C" stroke-opacity=".30" stroke-width="1.5" stroke-linecap="round">
      <path d="M206 222h84"/>
      <path d="M206 286h306M206 314h306M206 342h228M206 370h306M206 398h172"/>
      <path d="M206 470h306M206 498h248M206 526h306M206 554h140"/>
    </g>
    <g stroke="#C9A84C" stroke-opacity=".5" stroke-width="2">
      <path d="M206 434h306"/>
    </g>
  </g>

  <!-- contact shadow -->
  <ellipse cx="360" cy="676" rx="188" ry="30" fill="url(#hvShadow)"/>

  <!-- vial -->
  <g>
    <!-- crimp cap -->
    <rect x="286" y="158" width="148" height="26" rx="5" fill="url(#hvCap)"/>
    <rect x="272" y="184" width="176" height="62" rx="9" fill="url(#hvCap)"/>
    <g stroke="#3B2F12" stroke-opacity=".38" stroke-width="1.5">
      <path d="M296 192v46M320 192v46M344 192v46M368 192v46M392 192v46M416 192v46"/>
    </g>
    <!-- glass -->
    <rect x="252" y="238" width="216" height="380" rx="26" fill="url(#hvGlass)"/>
    <g clip-path="url(#hvBody)">
      <!-- lyophilized cake, sitting in the bottom third -->
      <path d="M252 470c34-14 62-18 108-18s74 4 108 18v148H252z" fill="url(#hvPowder)"/>
      <path d="M252 470c34-14 62-18 108-18s74 4 108 18v14c-34-12-62-16-108-16s-74 4-108 16z"
            fill="#fff" fill-opacity=".55"/>
      <!-- label, blank on purpose: the product name is real text in the page -->
      <rect x="268" y="392" width="184" height="144" rx="3" fill="url(#hvLabel)"/>
      <g stroke="#8b8577" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
        <path d="M296 424h128"/><path d="M296 452h96"/><path d="M296 476h128"/>
      </g>
      <path d="M296 500h72" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- specular edges, drawn last so they sit on top of the fill -->
    <rect x="252" y="238" width="216" height="380" rx="26"
          stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
    <path d="M272 268v300" stroke="#fff" stroke-opacity=".34" stroke-width="7" stroke-linecap="round"/>
    <path d="M446 288v240" stroke="#fff" stroke-opacity=".16" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
